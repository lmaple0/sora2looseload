name: build

on:
  push:
  pull_request:

jobs:
  release-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install verifier dependency
        run: python -m pip install pefile

      - name: Run unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v

      - name: Build Release x64
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw "Visual Studio Build Tools not found" }
          $devcmd = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          cmd /d /c "call `"$devcmd`" -arch=amd64 -host_arch=amd64 >nul && msbuild `"sora1looseload.sln`" /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify XInput proxy
        run: python tools/verify_proxy.py x64/Release/xinput1_4.dll

      - uses: actions/upload-artifact@v7
        with:
          name: sora2looseload-release-x64
          path: |
            x64/Release/xinput1_4.dll
            dist/sora2looseload.ini
            README.md
            README.zh-CN.md
            LICENSE
